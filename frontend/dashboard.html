<!doctype html>
<html lang="en">
  <head>

              "secondary-container": "#d8e6e1",

              "tertiary-fixed": "#ffdad5",

              "on-surface-variant": "#3e4945",

    <style>
      body { font-family: "Inter", sans-serif; }
      h1, h2, h3, .display-font { font-family: "Manrope", sans-serif; }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        vertical-align: middle;
      }
      .soft-shadow { box-shadow: 0 12px 32px -4px rgba(27, 27, 28, 0.06); }
      .glass-nav {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .sidebar-transition {
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .stat-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .stat-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 40px -8px rgba(0,0,0,0.08);
      }
    </style>
  </head>

  <body class="bg-background text-on-surface overflow-x-hidden">
    <div class="flex min-h-screen">
      <!-- Mobile Overlay -->
      <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar-transition fixed top-0 left-0 z-50 h-screen w-72 max-w-[85vw] bg-surface border-r border-outline-variant/20 flex flex-col -translate-x-full lg:translate-x-0 lg:sticky lg:top-0 lg:z-auto">
        <div class="p-6 sm:p-8 flex items-center justify-between gap-4 border-b border-outline-variant/10 lg:border-b-0">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center text-on-primary">
              <span class="material-symbols-outlined">school</span>
            </div>
            <div>
              <h2 class="text-on-surface font-headline font-bold leading-tight">University Portal</h2>
              <p class="text-on-surface-variant text-xs font-body">Lecturer Access</p>
            </div>
          </div>
          <button id="closeSidebar" type="button" class="lg:hidden w-10 h-10 rounded-full hover:bg-surface-container flex items-center justify-center" aria-label="Close menu">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <nav class="flex-1 px-4 py-4 space-y-2 mt-2 lg:mt-4 overflow-y-auto no-scrollbar">
          <a class="flex items-center gap-4 px-4 py-3 rounded-xl bg-secondary-container text-primary font-medium transition-all" href="dashboard.html">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="font-body">Dashboard</span>
            <div class="ml-auto w-1 h-6 bg-primary rounded-full"></div>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-low transition-all" href="mark-attendance.html">
            <span class="material-symbols-outlined">fact_check</span>
            <span class="font-body">Mark Attendance</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-low transition-all" href="attendance-records.html">
            <span class="material-symbols-outlined">analytics</span>
            <span class="font-body">Attendance Records</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-low transition-all" href="attendance-eligibility.html">
            <span class="material-symbols-outlined">rule</span>
            <span class="font-body">Attendance Eligibility</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-low transition-all mt-8" href="settings.html">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-body">Settings</span>
          </a>
          <button id="logoutBtn" class="flex items-center gap-4 w-full px-4 py-3 rounded-xl text-error hover:bg-error-container/10 transition-all">
            <span class="material-symbols-outlined">logout</span>
            <span class="font-body">Logout</span>
          </button>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 flex flex-col min-w-0 w-full">
        <!-- TopNavBar -->
        <header class="h-auto min-h-20 glass-nav border-b border-outline-variant/10 px-4 sm:px-6 lg:px-10 py-4 lg:py-0 flex items-center sticky top-0 z-30">
          <div class="flex items-center gap-3 sm:gap-4 flex-1">
            <button id="openSidebar" type="button" class="lg:hidden w-11 h-11 rounded-full bg-surface-container-low hover:bg-surface-container flex items-center justify-center shrink-0" aria-label="Open menu">
              <span class="material-symbols-outlined">menu</span>
            </button>
            <div class="relative w-full max-w-md">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
              <input class="w-full bg-surface-container-low border-none rounded-full py-2.5 pl-12 pr-4 sm:pr-6 text-sm focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Search for students, courses, or records..." type="text" />
            </div>
            <div class="flex items-center gap-2 ml-auto">
              <span id="lecturerNameDisplay" class="text-sm font-semibold hidden sm:inline">Lecturer</span>
              <div class="w-9 h-9 rounded-full bg-primary-container/20 flex items-center justify-center text-primary font-bold">
                <span id="lecturerInitial">L</span>
              </div>
            </div>
          </div>
        </header>

        <!-- Dashboard Content -->
        <div id="dashboardContent" class="p-4 sm:p-6 lg:p-10 space-y-8 lg:space-y-12 overflow-y-auto no-scrollbar">
          <!-- Welcome Section -->
          <section class="flex flex-col gap-3 sm:gap-4 sm:flex-row sm:justify-between sm:items-end">
            <div>
              <h2 class="text-2xl sm:text-3xl font-headline font-bold text-on-surface tracking-tight">
                Academic Overview
              </h2>
              <p id="welcomeMessage" class="text-on-surface-variant font-body mt-1 text-sm sm:text-base">
                Loading your teaching stats…
              </p>
            </div>
          </section>

          <!-- Stat Cards -->
          <section id="statsContainer" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6 lg:gap-8">
            <!-- Will be populated by JS -->
          </section>

          <!-- Course Attendance Summary -->
          <section class="space-y-6 pb-6 sm:pb-0">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <h3 class="text-lg sm:text-xl font-headline font-bold text-on-surface">Your Course Attendance</h3>
            </div>
            <div id="courseSummaryContainer" class="bg-surface-container-lowest rounded-xl soft-shadow overflow-hidden p-6">
              <!-- Will be populated by JS -->
            </div>
          </section>

          <!-- Recent Attendance Activity -->
          <section class="space-y-6 pb-6 sm:pb-0">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <h3 class="text-lg sm:text-xl font-headline font-bold text-on-surface">Recent Attendance Activity</h3>
            </div>
            <div id="recentActivityContainer" class="bg-surface-container-lowest rounded-xl soft-shadow overflow-hidden">
              <!-- Will be populated by JS -->
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Sidebar toggle script (non‑module) -->
    <script>
      (function() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');

        function openSidebar() {
          sidebar.classList.remove('-translate-x-full');
          overlay.classList.remove('hidden');
        }
        function closeSidebar() {
          sidebar.classList.add('-translate-x-full');
          overlay.classList.add('hidden');
        }

        if (openBtn) openBtn.addEventListener('click', openSidebar);
        if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
        if (overlay) overlay.addEventListener('click', closeSidebar);
      })();
    </script>

    <!-- Main Module Script -->
    <script type="importmap">
      {
        "imports": {
          "./js/": "./js/"
        }
      }
    </script>
    <script type="module">
      import userService from './js/userService.js';
      import attendanceService from './js/attendanceService.js';
      import apiService from './js/apiService.js';

      // ─── DOM refs ────────────────────────────────────────────────────────
      const statsContainer = document.getElementById('statsContainer');
      const courseSummaryContainer = document.getElementById('courseSummaryContainer');
      const recentActivityContainer = document.getElementById('recentActivityContainer');
      const welcomeMessage = document.getElementById('welcomeMessage');
      const lecturerNameDisplay = document.getElementById('lecturerNameDisplay');
      const lecturerInitial = document.getElementById('lecturerInitial');

      // ─── Helpers ─────────────────────────────────────────────────────────
      function getInitials(name) {
        if (!name) return 'L';
        return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
      }

      function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function statusBadge(status) {
        const base = 'inline-flex px-4 py-1.5 rounded-full text-xs font-bold';
        if (status === 'present') return `${base} bg-primary-fixed text-on-primary-fixed-variant`;
        if (status === 'excused') return `${base} bg-tertiary-fixed text-on-tertiary-fixed-variant`;
        return `${base} bg-error-container text-on-error-container`;
      }

      // ─── Check auth ──────────────────────────────────────────────────────
      const token = apiService.getToken();
      if (!token) {
        window.location.href = 'index.html';
      }

      // ─── Load data ──────────────────────────────────────────────────────
      let lecturerData = null;
      let courseSummaries = [];
      let allRecent = [];

      async function loadDashboard() {
        try {
          // 1. Get lecturer info
          const meRes = await userService.getMe();
          if (!meRes.success || !meRes.lecturer) throw new Error('Failed to load lecturer data');
          lecturerData = meRes.lecturer;
          const name = lecturerData.fullName || 'Lecturer';
          lecturerNameDisplay.textContent = name;
          lecturerInitial.textContent = getInitials(name);
          welcomeMessage.textContent = `Welcome back, ${name.split(' ')[0]}! Here's your teaching overview.`;

          // 2. For each course, fetch summary
          const courses = lecturerData.courses || [];
          const summaries = [];
          let allStudents = new Set();

          for (const code of courses) {
            try {
              const summaryRes = await attendanceService.getCourseSummary(code);
              if (summaryRes.success && summaryRes.summary) {
                summaries.push({
                  courseCode: code,
                  summary: summaryRes.summary,
                  totalSessions: summaryRes.totalSessions || 0,
                });
                // collect unique students
                summaryRes.summary.forEach(s => {
                  if (s.student && s.student._id) allStudents.add(s.student._id);
                });
              } else {
                summaries.push({ courseCode: code, summary: [], totalSessions: 0 });
              }
            } catch (e) {
              console.warn(`Could not fetch summary for ${code}:`, e.message);
              summaries.push({ courseCode: code, summary: [], totalSessions: 0 });
            }
          }
          courseSummaries = summaries;

          // 3. Build stats
          const totalCourses = courses.length;
          const totalStudents = allStudents.size;
          // Count students below 70% across all courses (unique)
          const below70 = new Set();
          summaries.forEach(s => {
            s.summary.forEach(entry => {
              if (entry.percentage < 70 && entry.student && entry.student._id) {
                below70.add(entry.student._id);
              }
            });
          });

          // 4. Render stats
          renderStats(totalCourses, totalStudents, below70.size);

          // 5. Render course summaries
          renderCourseSummaries(summaries);

          // 6. Fetch recent attendance (today for each course)
          const today = new Date().toISOString().slice(0,10);
          const recentRecords = [];
          for (const code of courses) {
            try {
              const attRes = await attendanceService.getAttendance(code, today);
              if (attRes.success && attRes.records && attRes.records.length) {
                attRes.records.forEach(r => {
                  recentRecords.push({
                    courseCode: code,
                    studentName: r.student?.fullName || 'Unknown',
                    matric: r.student?.matricNumber || '',
                    status: r.status || 'absent',
                    markedAt: r.markedAt || new Date().toISOString(),
                  });
                });
              }
            } catch (e) {
              // ignore
            }
          }
          // Sort by markedAt descending
          recentRecords.sort((a,b) => new Date(b.markedAt) - new Date(a.markedAt));
          allRecent = recentRecords.slice(0, 5); // show top 5

          renderRecentActivity(allRecent);

        } catch (error) {
          console.error('Dashboard load error:', error);
          welcomeMessage.textContent = '⚠️ Failed to load dashboard data. Please refresh.';
        }
      }

      // ─── Render functions ──────────────────────────────────────────────
      function renderStats(courses, students, below70) {
        statsContainer.innerHTML = `
          <div class="bg-surface-container-lowest p-6 sm:p-8 rounded-xl soft-shadow stat-card">
            <div class="flex justify-between items-start mb-6">
              <div class="w-12 h-12 rounded-xl bg-primary-container/10 flex items-center justify-center text-primary">
                <span class="material-symbols-outlined">menu_book</span>
              </div>
            </div>
            <h3 class="text-3xl sm:text-4xl font-headline font-extrabold text-on-surface">${courses}</h3>
            <p class="text-on-surface-variant font-body text-sm mt-1">Total Courses</p>
          </div>
          <div class="bg-surface-container-lowest p-6 sm:p-8 rounded-xl soft-shadow stat-card">
            <div class="flex justify-between items-start mb-6">
              <div class="w-12 h-12 rounded-xl bg-secondary-container/30 flex items-center justify-center text-secondary">
                <span class="material-symbols-outlined">group</span>
              </div>
            </div>
            <h3 class="text-3xl sm:text-4xl font-headline font-extrabold text-on-surface">${students}</h3>
            <p class="text-on-surface-variant font-body text-sm mt-1">Total Students</p>
          </div>
          <div class="bg-error-container/20 p-6 sm:p-8 rounded-xl soft-shadow stat-card sm:col-span-2 xl:col-span-1">
            <div class="flex justify-between items-start mb-6">
              <div class="w-12 h-12 rounded-xl bg-error/10 flex items-center justify-center text-error">
                <span class="material-symbols-outlined">warning</span>
              </div>
              <span class="text-xs font-semibold text-error">CRITICAL</span>
            </div>
            <h3 class="text-3xl sm:text-4xl font-headline font-extrabold text-error">${below70}</h3>
            <p class="text-on-error-container font-body text-sm mt-1">Students Below 70%</p>
          </div>
        `;
      }

      function renderCourseSummaries(summaries) {
        if (!summaries.length) {
          courseSummaryContainer.innerHTML = `<p class="text-on-surface-variant">You are not assigned to any courses yet.</p>`;
          return;
        }
        let html = `<div class="space-y-4">`;
        summaries.forEach(s => {
          const code = s.courseCode;
          const total = s.totalSessions;
          const entries = s.summary || [];
          // show only top 5 students by percentage
          const sorted = [...entries].sort((a,b) => b.percentage - a.percentage).slice(0,5);
          html += `
            <div class="border-b border-outline-variant/20 pb-4 last:border-0">
              <div class="flex justify-between items-center mb-2">
                <h4 class="font-bold text-on-surface">${code}</h4>
                <span class="text-sm text-on-surface-variant">${total} sessions</span>
              </div>
              ${entries.length === 0 ? `<p class="text-sm text-on-surface-variant">No attendance data yet.</p>` : `
                <div class="grid grid-cols-1 gap-2">
                  ${sorted.map(entry => `
                    <div class="flex justify-between items-center text-sm">
                      <span>${entry.student?.fullName || 'Unknown'} (${entry.student?.matricNumber || ''})</span>
                      <span class="font-semibold ${entry.percentage < 70 ? 'text-error' : 'text-primary'}">${entry.percentage}%</span>
                    </div>
                  `).join('')}
                  ${entries.length > 5 ? `<div class="text-xs text-on-surface-variant mt-1">+ ${entries.length - 5} more</div>` : ''}
                </div>
              `}
            </div>
          `;
        });
        html += `</div>`;
        courseSummaryContainer.innerHTML = html;
      }

      function renderRecentActivity(records) {
        if (!records.length) {
          recentActivityContainer.innerHTML = `
            <div class="p-6 text-center text-on-surface-variant">
              No recent attendance marked today.
            </div>
          `;
          return;
        }
        let html = `
          <div class="hidden md:block p-6 sm:p-8 pb-0">
            <div class="grid grid-cols-12 px-4 py-3 bg-surface-container-low rounded-lg">
              <div class="col-span-4 text-xs font-label uppercase tracking-wider text-on-surface-variant font-bold">Student</div>
              <div class="col-span-4 text-xs font-label uppercase tracking-wider text-on-surface-variant font-bold">Course</div>
              <div class="col-span-2 text-xs font-label uppercase tracking-wider text-on-surface-variant font-bold">Time</div>
              <div class="col-span-2 text-xs font-label uppercase tracking-wider text-on-surface-variant font-bold text-right">Status</div>
            </div>
          </div>
          <div class="p-3 sm:p-4 md:space-y-1">
        `;
        records.forEach(r => {
          const time = new Date(r.markedAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
          html += `
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-0 items-start md:items-center px-4 py-4 rounded-xl hover:bg-surface-container-high transition-all">
              <div class="md:col-span-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center font-bold text-xs">
                  ${r.studentName.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
                </div>
                <span class="font-semibold text-on-surface">${r.studentName}</span>
              </div>
              <div class="md:col-span-4 text-sm text-on-surface-variant">
                <span class="md:hidden font-semibold text-on-surface">Course: </span>${r.courseCode}
              </div>
              <div class="md:col-span-2 text-sm text-on-surface-variant">
                <span class="md:hidden font-semibold text-on-surface">Time: </span>${time}
              </div>
              <div class="md:col-span-2 md:text-right">
                <span class="${statusBadge(r.status)}">${r.status.toUpperCase()}</span>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        recentActivityContainer.innerHTML = html;
      }

      // ─── Logout ──────────────────────────────────────────────────────────
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
          await userService.logout();
        } catch (e) {
          // ignore
        }
        apiService.setToken(null);
        window.location.href = 'index.html';
      });

      // ─── Init ────────────────────────────────────────────────────────────
      // Only run if we have a token (otherwise we already redirected)
      if (token) {
        loadDashboard();
      }
    </script>
  </body>
</html>
