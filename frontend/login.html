<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>EduAttend · Lecturer Login</title>

    <!-- Tailwind + plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind config -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-fixed-dim": "#bccac5",
              "primary-container": "#1f7a63",
              "surface-container-low": "#f6f3f2",
              "on-background": "#1b1b1c",
              "on-primary-fixed": "#002018",
              "on-error": "#ffffff",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#ffb4a8",
              "on-tertiary-fixed": "#3c0804",
              "error-container": "#ffdad6",
              "outline-variant": "#bec9c3",
              "surface-variant": "#e5e2e1",
              "tertiary-container": "#a3574c",
              "on-primary": "#ffffff",
              "secondary-container": "#d8e6e1",
              "surface-container-high": "#eae7e7",
              "tertiary-fixed": "#ffdad5",
              "on-primary-fixed-variant": "#005140",
              "on-tertiary-fixed-variant": "#74332a",
              "surface-dim": "#dcd9d9",
              "primary-fixed-dim": "#82d6bb",
              "on-tertiary-container": "#ffebe8",
              "on-secondary-container": "#5a6763",
              error: "#ba1a1a",
              "on-secondary-fixed": "#121e1b",
              "on-secondary-fixed-variant": "#3d4946",
              background: "#fcf9f8",
              "primary-fixed": "#9ef3d7",
              secondary: "#54615d",
              "inverse-on-surface": "#f3f0ef",
              surface: "#fcf9f8",
              tertiary: "#854036",
              "surface-bright": "#fcf9f8",
              primary: "#00604c",
              "surface-tint": "#016b55",
              "on-surface": "#1b1b1c",
              "inverse-primary": "#82d6bb",
              "surface-container-highest": "#e5e2e1",
              "secondary-fixed": "#d8e6e1",
              outline: "#6e7a74",
              "on-error-container": "#93000a",
              "on-secondary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "on-surface-variant": "#3e4945",
              "surface-container": "#f0eded",
              "inverse-surface": "#303030",
              "on-primary-container": "#b1ffe4",
            },
            fontFamily: {
              headline: ["Manrope", "sans-serif"],
              body: ["Inter", "sans-serif"],
              label: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "1.5rem",
              full: "9999px",
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      h1, h2, h3, .display-font {
        font-family: "Manrope", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        vertical-align: middle;
      }
      .soft-shadow {
        box-shadow: 0 12px 32px -4px rgba(27, 27, 28, 0.06);
      }
      .bg-subtle-pattern {
        background-color: #fcf9f8;
        background-image: radial-gradient(
          rgba(0, 96, 76, 0.03) 1px,
          transparent 1px
        );
        background-size: 24px 24px;
      }
      .modal-overlay {
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4 sm:p-6 bg-subtle-pattern relative"
  >

    <!-- Main login card -->
    <div class="w-full max-w-md">
      <div
        class="bg-surface-container-lowest rounded-[2rem] p-6 sm:p-8 soft-shadow border border-outline-variant/10"
      >
        <div class="mb-8 text-center sm:text-left">
          <div
            class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center text-on-primary mb-5 mx-auto sm:mx-0"
          >
            <span class="material-symbols-outlined text-[28px]">login</span>
          </div>
          <h2 class="text-3xl font-headline font-bold tracking-tight">
            Lecturer Login
          </h2>
          <p class="text-on-surface-variant mt-2">
            Enter your credentials to access the portal.
          </p>
        </div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-on-surface mb-2" for="email"
              >Email Address</label>
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg"
                >mail</span>
              <input
                id="email"
                type="email"
                class="w-full bg-surface-container-high border-none rounded-xl py-3.5 pl-12 pr-4 text-on-surface font-medium focus:ring-2 focus:ring-primary"
                placeholder="Enter lecturer email"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-on-surface mb-2" for="password"
              >Password</label>
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg"
                >lock</span>
              <input
                id="password"
                type="password"
                class="w-full bg-surface-container-high border-none rounded-xl py-3.5 pl-12 pr-14 text-on-surface font-medium focus:ring-2 focus:ring-primary"
                placeholder="Enter password"
                required
              />
              <button
                id="togglePasswordBtn"
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full hover:bg-surface-container flex items-center justify-center text-on-surface-variant transition-all"
                aria-label="Toggle password visibility"
              >
                <span id="togglePasswordIcon" class="material-symbols-outlined"
                  >visibility</span>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between gap-4 flex-wrap">
            <label class="inline-flex items-center gap-3 cursor-pointer">
              <input
                type="checkbox"
                class="rounded border-outline-variant text-primary focus:ring-primary"
              />
              <span class="text-sm text-on-surface-variant">Remember me</span>
            </label>
          </div>

          <button
            type="submit"
            id="loginBtn"
            class="w-full bg-primary text-on-primary py-3.5 rounded-xl font-semibold flex items-center justify-center gap-3 hover:bg-primary-container transition-all soft-shadow"
          >
            <span class="material-symbols-outlined">login</span>
            Sign In
          </button>

          <!-- dynamic message area -->
          <p id="loginMessage" class="hidden text-sm font-medium rounded-lg px-4 py-3"></p>
        </form>
      </div>
    </div>

    <!-- OTP Modal (hidden by default) -->
    <div
      id="otpModal"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden"
    >
      <div class="bg-surface-container-lowest rounded-2xl p-6 max-w-sm w-full soft-shadow">
        <h3 class="text-xl font-headline font-bold mb-2">Two‑Factor Authentication</h3>
        <p class="text-sm text-on-surface-variant mb-4">
          An OTP has been sent to your email. Please enter it below.
        </p>
        <input
          id="otpInput"
          type="text"
          maxlength="6"
          class="w-full bg-surface-container-high border-none rounded-xl py-3 px-4 text-center text-2xl tracking-widest font-mono focus:ring-2 focus:ring-primary"
          placeholder="000000"
        />
        <div class="flex gap-3 mt-4">
          <button
            id="otpVerifyBtn"
            class="flex-1 bg-primary text-on-primary py-2.5 rounded-xl font-semibold hover:bg-primary-container transition-all"
          >
            Verify
          </button>
          <button
            id="otpCancelBtn"
            class="flex-1 bg-outline-variant/20 text-on-surface py-2.5 rounded-xl font-semibold hover:bg-outline-variant/30 transition-all"
          >
            Cancel
          </button>
        </div>
        <p id="otpMessage" class="text-sm mt-3 text-center hidden"></p>
      </div>
    </div>

    <!-- JavaScript Module -->
    <script type="importmap">
      {
        "imports": {
          "./js/": "./js/"
        }
      }
    </script>
    <script type="module">
      // ✅ Correct imports – files are directly under /js/
      import userService from './js/userService.js';
      import apiService from './js/apiService.js';

      // DOM elements
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const message = document.getElementById('loginMessage');
      const loginBtn = document.getElementById('loginBtn');

      // OTP modal elements
      const otpModal = document.getElementById('otpModal');
      const otpInput = document.getElementById('otpInput');
      const otpVerifyBtn = document.getElementById('otpVerifyBtn');
      const otpCancelBtn = document.getElementById('otpCancelBtn');
      const otpMessage = document.getElementById('otpMessage');

      // Toggle password visibility
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const toggleIcon = document.getElementById('togglePasswordIcon');
      toggleBtn.addEventListener('click', () => {
        const isPassword = password.type === 'password';
        password.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });

      // Helper: show message
      function showMessage(text, isError = true) {
        message.classList.remove('hidden', 'bg-primary-fixed', 'text-on-primary-fixed-variant', 'bg-error-container', 'text-on-error-container');
        if (isError) {
          message.classList.add('bg-error-container', 'text-on-error-container');
        } else {
          message.classList.add('bg-primary-fixed', 'text-on-primary-fixed-variant');
        }
        message.textContent = text;
      }

      function hideMessage() {
        message.classList.add('hidden');
        message.textContent = '';
      }

      // Login flow state
      let tempToken = null;

      // Handle form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();
        const emailVal = email.value.trim();
        const passVal = password.value.trim();

        if (!emailVal || !passVal) {
          showMessage('Please enter your email address and password.', true);
          return;
        }
        if (!emailVal.includes('@')) {
          showMessage('Please enter a valid email address.', true);
          return;
        }

        // Disable button and show loading
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="animate-pulse">Loading...</span>';

        try {
          const response = await userService.login(emailVal, passVal);

          if (response.success && response.token) {
            // Normal login (no 2FA)
            apiService.setToken(response.token);
            showMessage('Login successful. Redirecting...', false);
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          } else if (response.success && response.tempToken) {
            // 2FA required – show OTP modal
            tempToken = response.tempToken;
            otpModal.classList.remove('hidden');
            otpInput.value = '';
            otpInput.focus();
            otpMessage.classList.add('hidden');
            otpMessage.textContent = '';
            // enable login button again
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<span class="material-symbols-outlined">login</span> Sign In';
          } else {
            showMessage('Unexpected response from server.', true);
          }
        } catch (error) {
          showMessage(error.message || 'Login failed. Please try again.', true);
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span class="material-symbols-outlined">login</span> Sign In';
        }
      });

      // OTP verification
      otpVerifyBtn.addEventListener('click', async () => {
        const otp = otpInput.value.trim();
        if (!otp || otp.length !== 6) {
          otpMessage.classList.remove('hidden');
          otpMessage.textContent = 'Please enter a valid 6‑digit OTP.';
          otpMessage.className = 'text-sm mt-3 text-center text-error';
          return;
        }

        otpVerifyBtn.disabled = true;
        otpVerifyBtn.textContent = 'Verifying...';

        try {
          const emailVal = email.value.trim();
          const response = await userService.verifyOTP({
            email: emailVal,
            otp,
            purpose: 'login-2fa',
            tempToken,
          });

          if (response.success && response.token) {
            apiService.setToken(response.token);
            otpModal.classList.add('hidden');
            showMessage('Login successful. Redirecting...', false);
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          } else {
            otpMessage.classList.remove('hidden');
            otpMessage.textContent = response.message || 'OTP verification failed.';
            otpMessage.className = 'text-sm mt-3 text-center text-error';
            otpVerifyBtn.disabled = false;
            otpVerifyBtn.textContent = 'Verify';
          }
        } catch (error) {
          otpMessage.classList.remove('hidden');
          otpMessage.textContent = error.message || 'OTP verification failed.';
          otpMessage.className = 'text-sm mt-3 text-center text-error';
          otpVerifyBtn.disabled = false;
          otpVerifyBtn.textContent = 'Verify';
        }
      });

      // Cancel OTP
      otpCancelBtn.addEventListener('click', () => {
        otpModal.classList.add('hidden');
        tempToken = null;
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span class="material-symbols-outlined">login</span> Sign In';
        hideMessage();
      });

      // Close modal on overlay click
      otpModal.addEventListener('click', (e) => {
        if (e.target === otpModal) {
          otpCancelBtn.click();
        }
      });

      // Enter key in OTP input
      otpInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          otpVerifyBtn.click();
        }
      });

      // Auto‑redirect if already logged in
      (function checkAuth() {
        const token = apiService.getToken();
        if (token) {
          window.location.href = 'dashboard.html';
        }
      })();
    </script>
  </body>
</html>
